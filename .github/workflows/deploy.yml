name: CI and Deploy Demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Verify bundled share images
        shell: bash
        run: |
          image_count="$(find "project/分享图打包" -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | wc -l | tr -d " ")"
          if [ "${image_count}" -lt 3 ]; then
            echo "Expected at least 3 bundled share images, found ${image_count}."
            exit 1
          fi

      - name: Smoke test
        shell: bash
        env:
          NODE_ENV: test
          PORT: 3000
        run: |
          node server.js >/tmp/melodyflow.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/melodyflow.log
          exit 1

  deploy:
    name: Deploy to Render
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"

      - name: Wait for the deployed commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          LIVE_BASE_URL: https://melodyflow-demo.onrender.com
        shell: bash
        run: |
          for attempt in {1..90}; do
            health_body="$(curl --fail --silent --max-time 10 \
              "${LIVE_BASE_URL}/health" || true)"
            live_commit="$(jq --raw-output '.commit // empty' <<<"${health_body}")"
            if [ "${live_commit}" = "${COMMIT_SHA}" ]; then
              echo "Verified deployed commit ${COMMIT_SHA}."
              exit 0
            fi
            echo "Waiting for Render deployment (${attempt}/90); live commit: ${live_commit:-unavailable}"
            sleep 10
          done

          echo "Render did not expose commit ${COMMIT_SHA} within 15 minutes."
          exit 1
